# Релизы по версии. Триггер — смена `version` в gradle.properties (единственный
# источник версии): пуш в master сверяет её с тегом v<версия> — тег уже есть,
# значит релиз этой версии собран, и сборка не запускается вовсе.
# Результат: GitHub Release v<версия> с MSI (Windows), deb (Linux) и
# portable-архивами (распаковал — и запускается, свой рантайм внутри).
name: release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      force:
        description: 'Пересобрать, даже если версия не менялась'
        type: boolean
        default: false

# тег v<версия> и GitHub Release
permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── 1. Нужна ли сборка: версия из gradle.properties vs существующие теги ──
  version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # нужны теги для сравнения
      - id: check
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -1 | tr -d '\r ')
          echo "Версия в gradle.properties: '$VERSION'"
          if ! grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' <<< "$VERSION"; then
            echo "::error::version='$VERSION' — ожидается формат N.N.N (ограничение jpackage для MSI)"
            exit 1
          fi
          FORCE="${{ inputs.force || false }}"
          if [ "$FORCE" = "true" ]; then
            echo "Ручной запуск с force — собираем независимо от тега"
            should=true
          elif git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Тег v$VERSION уже существует — версия не менялась, сборка не нужна"
            should=false
          else
            echo "Новая версия $VERSION — собираем"
            should=true
          fi
          {
            echo "version=$VERSION"
            echo "should_build=$should"
          } >> "$GITHUB_OUTPUT"

  # ── 2. Сборка дистрибутивов на обеих целевых платформах ──
  build:
    needs: version-check
    if: needs.version-check.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest   # MSI + portable zip
          # Не ubuntu-latest: с 19.10.2026 он переезжает на Ubuntu 26, а артефакты,
          # собранные на самой свежей системе, требуют слишком новую glibc у получателей.
          # LTS = максимальная совместимость deb/portable.
          - os: ubuntu-24.04     # deb + portable zip (+ тесты до сборки)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Тесты
        if: runner.os == 'Linux'
        run: ./gradlew test

      # WiX для MSI не ставим — Compose скачивает его сам (задачи :downloadWix/:unzipWix)

      - name: Сборка дистрибутивов (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat :desktop:packageMsi :desktop:createDistributable

      - name: Сборка дистрибутивов (Linux)
        if: runner.os == 'Linux'
        run: ./gradlew :desktop:packageDeb :desktop:createDistributable

      # Логи jpackage/WiX — чтобы красный прогон можно было диагностировать по артефакту
      - name: Сохранить логи сборки при ошибке
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ matrix.os }}
          path: desktop/build/compose/logs/
          if-no-files-found: ignore

      # Пути вывода Compose Desktop: desktop/build/compose/binaries/main/{msi,deb,app}
      - name: Упаковать артефакты (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "${{ needs.version-check.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem "desktop/build/compose/binaries/main/msi" -Filter *.msi | ForEach-Object {
            Copy-Item $_.FullName "dist/BookTranslator-$v-windows-x64.msi"
          }
          $appImage = Get-ChildItem "desktop/build/compose/binaries/main/app" -Directory | Select-Object -First 1
          Compress-Archive -Path "$($appImage.FullName)/*" -DestinationPath "dist/BookTranslator-$v-windows-portable.zip"

      - name: Упаковать артефакты (Linux)
        if: runner.os == 'Linux'
        run: |
          v="${{ needs.version-check.outputs.version }}"
          mkdir -p dist
          cp desktop/build/compose/binaries/main/deb/*.deb "dist/BookTranslator-$v-linux-amd64.deb"
          app_image=$(find desktop/build/compose/binaries/main/app -mindepth 1 -maxdepth 1 -type d | head -1)
          (cd "$app_image" && zip -qr "$OLDPWD/dist/BookTranslator-$v-linux-portable.zip" .)

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

  # ── 3. GitHub Release с готовыми файлами ──
  release:
    needs: [version-check, build]
    if: needs.version-check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Создать релиз v${{ needs.version-check.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          # Джоба без checkout: gh обычно узнаёт репозиторий из локального git,
          # без него нужен явный GH_REPO, иначе «fatal: not a git repository»
          GH_REPO: ${{ github.repository }}
        run: |
          v="${{ needs.version-check.outputs.version }}"
          dist_files=$(ls dist 2>/dev/null | wc -l)
          echo "Артефактов для загрузки: $dist_files"

          # Опубликованный релиз — эталон, его не трогаем
          if [ "$(gh release view "v$v" --json isDraft --jq '.isDraft' 2>/dev/null)" = "false" ]; then
            echo "Релиз v$v уже опубликован — пропускаю"
            exit 0
          fi

          # Черновик — машинный остаток прошлой попытки (gh при create с ассетами
          # держит релиз черновиком до конца загрузки; сбой посреди оставляет
          # осиротевший черновик БЕЗ тега — тег создаётся только публикацией).
          # Сносим и начинаем чисто, с правильным target.
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "Найден черновик v$v от прошлой попытки — сношу и пересоздаю"
            gh release delete "v$v" --yes
          fi

          # 1. Черновик. HTTP 5xx у GitHub API бывают мимолётными — ретраи.
          for attempt in 1 2 3; do
            if gh release create "v$v" --draft --target "$GITHUB_SHA" --title "v$v" --generate-notes; then
              break
            fi
            [ "$attempt" = 3 ] && { echo "::error::Черновик v$v не создан за 3 попытки"; exit 1; }
            echo "Создание, попытка $attempt не удалась — повтор через 15 с"
            sleep 15
          done

          # 2. Артефакты в черновик (сбой загрузки не создаёт тега — повтор досылает)
          for attempt in 1 2 3; do
            if gh release upload "v$v" dist/* --clobber; then
              break
            fi
            [ "$attempt" = 3 ] && { echo "::error::Артефакты v$v не загружены за 3 попытки"; exit 1; }
            echo "Загрузка, попытка $attempt не удалась — повтор через 15 с"
            sleep 15
          done

          # 3. Публикуем только то, что реально загрузилось
          uploaded=$(gh release view "v$v" --json assets --jq '.assets | length')
          if [ "$uploaded" != "$dist_files" ]; then
            echo "::error::На релизе $uploaded артефактов из $dist_files — публиковать нельзя"
            exit 1
          fi

          # 4. Публикация — только теперь создаётся тег v<версия>
          for attempt in 1 2 3; do
            if gh release edit "v$v" --draft=false; then
              echo "Релиз v$v опубликован ($uploaded артефактов)"
              exit 0
            fi
            [ "$attempt" = 3 ] && break
            echo "Публикация, попытка $attempt не удалась — повтор через 15 с"
            sleep 15
          done
          echo "::error::Релиз v$v не опубликован за 3 попытки; черновик с артефактами остался — следующий запуск добьёт"
          exit 1
