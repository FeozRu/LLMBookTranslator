org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.java.installations.fromEnv=JAVA_HOME
kotlin.code.style=official

# Версия приложения — ЕДИНСТВЕННОЕ место, откуда берётся версия.
# Смена этой строки (и пуш в master) = триггер релиза: CI собирает MSI/deb/portable
# и публикует GitHub Release с тегом v<версия>. Пока тег v<версия> существует,
# сборка релиза не запускается, что бы ни менялось в коде.
# Формат строго N.N.N — ограничение jpackage для MSI.
version=0.1.0
